name: 部署 GitHub Pages

# 部署 site/ 目录到 https://<用户名>.github.io/<仓库名>/
# 首次使用：仓库 Settings → Pages → Build and deployment → GitHub Actions

on:
  push:
    branches: [main, master]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'          # 兜底：数据工作流由 GITHUB_TOKEN 推送时不触发本工作流

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - id: deployment
        uses: actions/deploy-pages@v4
