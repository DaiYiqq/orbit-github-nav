<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="description" content="Orbit · GitHub 导航站 —— 自动收录 GitHub 优质仓库，按分类与星标整理，集成 AI 导航、AI 社区、博客与论文，支持搜索、筛选、收藏、分享与跨端同步。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Orbit">
  <meta property="og:title" content="Orbit · GitHub 导航站">
  <meta property="og:description" content="发现值得用的开源项目">
  <meta property="og:type" content="website">
  <meta property="og:url" content="">
  <meta property="og:image" content="./assets/icons/icon-512.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="author" content="Orbit">
  <meta name="color-scheme" content="light dark">
  <link rel="canonical" href="">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://api.github.com" crossorigin>
  <link rel="dns-prefetch" href="https://raw.githubusercontent.com">
  <link rel="dns-prefetch" href="https://github.com">
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"WebSite","name":"Orbit · GitHub 导航站","description":"自动收录 GitHub 优质仓库，按分类与星标整理，集成 AI 导航、社区、博客与论文，支持搜索、筛选、收藏与跨端同步。","inLanguage":"zh-CN"}
  </script>
  <title>Orbit · GitHub 导航站</title>
  <link rel="icon" type="image/svg+xml" href="./assets/icons/favicon.svg">
  <link rel="apple-touch-icon" href="./assets/icons/icon-180.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./assets/css/app.css">
  <link rel="stylesheet" href="./assets/css/motion.css">
</head>
<body>
  <a class="skip-link" href="#view">跳到主要内容</a>
  <div id="app">
    <!-- 顶部栏（桌面 + 移动） -->
    <header class="topbar" id="topbar">
      <div class="topbar-inner">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="打开菜单">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
        </button>
        <a class="brand" href="#/discover" aria-label="Orbit 首页">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 40 40" width="30" height="30">
              <defs><linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5E9BFF"/><stop offset="0.55" stop-color="#7C5CFF"/><stop offset="1" stop-color="#FF6482"/></linearGradient></defs>
              <rect width="40" height="40" rx="11" fill="url(#brandGrad)"/>
              <circle cx="20" cy="20" r="5.4" fill="#fff" opacity="0.96"/>
              <ellipse cx="20" cy="20" rx="13.4" ry="6.3" transform="rotate(-32 20 20)" fill="none" stroke="#fff" stroke-width="1.9" opacity="0.92"/>
              <circle cx="31.2" cy="12.8" r="2.5" fill="#fff"/>
            </svg>
          </span>
          <span class="brand-text"><strong>Orbit</strong><i>GitHub 导航站</i></span>
        </a>

        <button class="top-search" id="topSearchBtn" aria-label="全局搜索">
          <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="11" cy="11" r="6.6" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="m16 16 4.2 4.2" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
          <span>搜索仓库、AI 工具、论文…</span>
          <kbd>⌘ K</kbd>
        </button>

        <div class="top-actions">
          <button class="install-top-btn" id="smartInstallBtn" title="一键安装到手机或电脑">
            <svg viewBox="0 0 24 24" width="15" height="15"><path d="M12 3.5v11m0 0 4-4m-4 4-4-4M4.5 17.5v1A2.5 2.5 0 0 0 7 21h10a2.5 2.5 0 0 0 2.5-2.5v-1" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>一键安装</span>
          </button>
          <button class="icon-btn" id="guideBtn" aria-label="新手指南" title="新手指南">
            <svg viewBox="0 0 24 24" width="19" height="19"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9.5 9.3a2.6 2.6 0 1 1 3.5 2.5c-.7.3-1 .9-1 1.7v.3M12 17h.01" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
          <button class="icon-btn" id="themeBtn" aria-label="切换外观" title="切换外观">
            <svg class="ico-sun" viewBox="0 0 24 24" width="19" height="19"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.6v2M12 19.4v2M2.6 12h2M19.4 12h2M5.4 5.4l1.4 1.4M17.2 17.2l1.4 1.4M18.6 5.4l-1.4 1.4M6.8 17.2l-1.4 1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <svg class="ico-moon" viewBox="0 0 24 24" width="19" height="19"><path d="M20.2 14.6A8.6 8.6 0 0 1 9.4 3.8 8.6 8.6 0 1 0 20.2 14.6Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          </button>
          <button class="icon-btn" id="shareSiteBtn" aria-label="分享本站" title="分享本站">
            <svg viewBox="0 0 24 24" width="19" height="19"><path d="M12 15.5V3.8m0 0L8.2 7.6M12 3.8l3.8 3.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 13.6v4.7A2.7 2.7 0 0 0 7.7 21h8.6a2.7 2.7 0 0 0 2.7-2.7v-4.7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
          <button class="avatar-btn" id="accountBtn" aria-label="账号与同步" title="账号与同步">
            <span class="avatar-guest" id="avatarEl">游</span>
          </button>
        </div>
      </div>
    </header>

    <!-- 左侧导航（桌面） -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-scroll" id="sidebarNav"></div>
      <div class="sidebar-foot">
        <button class="install-btn" id="installBtn">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 3.5v11m0 0 4-4m-4 4-4-4M4.5 17.5v1A2.5 2.5 0 0 0 7 21h10a2.5 2.5 0 0 0 2.5-2.5v-1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>安装应用</span>
        </button>
        <div class="sync-status" id="syncStatus"><span class="dot"></span><span>本地模式 · 无需登录</span></div>
      </div>
    </aside>
    <div class="sidebar-scrim" id="sidebarScrim"></div>

    <!-- 主内容 -->
    <main class="main" id="main">
      <div class="page-wrap" id="view" role="main"></div>
      <footer class="site-footer">
        <div><strong>Orbit</strong> · 发现值得用的开源项目</div>
        <div class="footer-links">
          <a href="https://github.com" target="_blank" rel="noopener">GitHub</a>
          <a href="#/settings">关于与设置</a>
          <span id="footerMeta">数据加载中…</span>
        </div>
      </footer>
    </main>

    <!-- 移动端底部标签栏 -->
    <nav class="tabbar" id="tabbar" aria-label="主导航"></nav>

    <!-- 仓库详情抽屉 -->
    <div class="drawer-scrim" id="drawerScrim"></div>
    <aside class="drawer" id="drawer" aria-label="项目详情"></aside>

    <!-- 命令面板 -->
    <div class="cmdk-overlay" id="cmdkOverlay">
      <div class="cmdk" role="dialog" aria-modal="true" aria-label="全局搜索">
        <div class="cmdk-input-row">
          <svg viewBox="0 0 24 24" width="19" height="19"><circle cx="11" cy="11" r="6.6" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="m16 16 4.2 4.2" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
          <input id="cmdkInput" type="search" placeholder="搜索仓库、分类、AI 工具、论文、社区…" autocomplete="off" spellcheck="false">
          <kbd>ESC</kbd>
        </div>
        <div class="cmdk-results" id="cmdkResults"></div>
        <div class="cmdk-foot"><span><kbd>↑</kbd><kbd>↓</kbd> 选择</span><span><kbd>↵</kbd> 打开</span><span>数据来自 GitHub 公开索引</span></div>
      </div>
    </div>

    <!-- 弹层 / 提示 -->
    <div class="modal-overlay" id="modalOverlay"><div class="modal" id="modal"></div></div>
    <div class="toast-stack" id="toastStack" aria-live="polite"></div>
  </div>

  <!-- 云服务 SDK 异步注入：不阻塞首屏渲染；加载完成后通知 cloud.js 初始化 -->
  <script>
    (function () {
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js';
      s.async = true;
      s.onload = function () { document.dispatchEvent(new Event('orbit:sdk-ready')); };
      s.onerror = function () { window.__ORBIT_SDK_FAILED__ = true; document.dispatchEvent(new Event('orbit:sdk-failed')); };
      document.head.appendChild(s);
    })();
  </script>
  <script src="./config.js"></script>
  <script src="./cloud-config.js"></script>
  <script src="./data/catalog.js"></script>
  <script src="./data/docs.js"></script>
  <script src="./data/repos.js"></script>
  <script src="./assets/js/core.js"></script>
  <script src="./assets/js/cloud.js"></script>
  <script src="./assets/js/auth-ui.js"></script>
  <script src="./assets/js/store.js"></script>
  <script src="./assets/js/source.js"></script>
  <script src="./assets/js/views.js"></script>
  <script src="./assets/js/pages.js"></script>
  <script src="./assets/js/app.js"></script>
  <script src="./assets/js/motion.js"></script>
  <script src="./assets/js/a11y.js"></script>
</body>
</html>
