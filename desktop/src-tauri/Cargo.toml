[package]
name = "orbit-github-nav"
version = "1.0.0"
description = "Orbit · GitHub 导航站桌面客户端"
authors = ["Orbit"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "orbit_github_nav_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
